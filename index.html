<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Rejector</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Averia+Libre:ital,wght@0,300;0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <!-- ======================= MAIL CLIENT ======================= -->
    <div id="app">

        <!-- Topbar (UI bar) -->
        <header id="topbar" class="bar">
            <div class="brand">
                <span class="brand-dot"></span>
                <span class="brand-name">ARTIST_REJECTOR</span>
                <span class="brand-tag hud">navi://inbox</span>
            </div>
            <div class="topbar-right">
                <button id="lang-toggle" class="hud" title="Cambiar idioma / Switch language">EN</button>
                <div id="rejection-counter" title="Rechazos acumulados">
                    <span class="rejection-label hud" data-i18n="rejected">RECHAZOS</span>
                    <span id="rejection-count">0</span>
                </div>
                <button id="sound-toggle" title="Sonido de notificación">🔊</button>
            </div>
        </header>

        <div id="client">
            <!-- Sidebar -->
            <nav id="sidebar">
                <button class="compose" disabled data-i18n="compose">✎ REDACTAR</button>
                <ul class="folders">
                    <li class="folder active" data-folder="inbox">
                        <span class="f-icon">▣</span>
                        <span class="f-name" data-i18n="inbox">Recibidos</span>
                        <span class="f-badge" id="inbox-badge">0</span>
                    </li>
                    <li class="folder" data-folder="sent">
                        <span class="f-icon">➤</span>
                        <span class="f-name" data-i18n="sent">Enviados</span>
                    </li>
                    <li class="folder" data-folder="spam">
                        <span class="f-icon">⚠</span>
                        <span class="f-name" data-i18n="spam">Spam</span>
                        <span class="f-badge" id="spam-badge">0</span>
                    </li>
                </ul>
                <div class="sidebar-foot">
                    <div id="video-box">
                        <img id="bg-gif" src="Image/loop.gif" alt="" draggable="false">
                    </div>
                    <div class="quota">
                        <div class="quota-bar"><span id="quota-fill"></span></div>
                        <small id="quota-text" class="hud" data-i18n="quota">memoria: ∞ rechazos</small>
                    </div>
                </div>
            </nav>

            <!-- Email list -->
            <section id="list-pane">
                <div class="list-head bar">
                    <span id="list-title">Recibidos</span>
                    <span id="list-sub" class="hud"></span>
                </div>
                <ul id="email-list"></ul>
            </section>

            <!-- Reading pane -->
            <section id="read-pane">
                <button id="reader-back" class="hud" type="button" data-i18n="back">← BANDEJA</button>
                <div id="empty-state">
                    <div class="empty-mark">✉</div>
                    <p data-i18n="emptyMain">Seleccioná un mensaje para leer.</p>
                    <p class="hud dim" data-i18n="emptySub">no signal · elegí un nodo</p>
                </div>
                <article id="reader" class="hidden"></article>
            </section>
        </div>

        <!-- Status bar (Lain HUD) -->
        <footer id="statusbar" class="bar hud">
            <span class="st-link">● WIRED</span>
            <span id="st-feed">incoming…</span>
            <span class="st-spacer"></span>
            <span id="st-clock">--:--:--</span>
            <span class="st-present">present day. present time.</span>
        </footer>
    </div>

    <!-- New-mail toast -->
    <div id="toast" class="hidden"></div>

    <!-- ======================= CRT / TV OVERLAYS ======================= -->
    <div class="fx fx-grain"></div>
    <div class="fx fx-scanlines"></div>
    <div class="fx fx-rollbar"></div>
    <div class="fx fx-vignette"></div>
    <div class="fx fx-flicker"></div>

    <script src="app.js"></script>
</body>

</html>
